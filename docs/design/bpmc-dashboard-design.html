<style>
/* Layout: purane AI Studio app jaisa — upar header, baayein safed sidebar (project card + menu),
   beech mein har section: tarikh filter → stat cards → tables. Phone par sidebar ☰ se khulta hai. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --ink: #0f1b2d;
  --muted: #5f6b7a;
  --line: #e3e7ed;
  --nav-active: #0f1b2d;
  --nav-active-ink: #ffffff;
  --accent: #f59e0b;
  --accent-ink: #1f1300;
  --accent-soft: #fff4dd;
  --ok: #15803d; --ok-bg: #e7f6ec;
  --warn: #b45309; --warn-bg: #fff3dc;
  --crit: #c62828; --crit-bg: #fdecec;
  --info: #1d4ed8; --info-bg: #e8efff;
  --font: "Mukta", "Nirmala UI", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141d; --surface: #141e2a; --surface-2: #1a2633; --ink: #e8edf3; --muted: #94a3b4; --line: #243346;
    --nav-active: #f59e0b; --nav-active-ink: #1f1300; --accent: #f8a91f; --accent-ink: #1f1300; --accent-soft: #33260c;
    --ok: #4ade80; --ok-bg: #11301d; --warn: #fbbf24; --warn-bg: #33270c; --crit: #f87171; --crit-bg: #3a1717; --info: #93b4ff; --info-bg: #17254a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141d; --surface: #141e2a; --surface-2: #1a2633; --ink: #e8edf3; --muted: #94a3b4; --line: #243346;
  --nav-active: #f59e0b; --nav-active-ink: #1f1300; --accent: #f8a91f; --accent-ink: #1f1300; --accent-soft: #33260c;
  --ok: #4ade80; --ok-bg: #11301d; --warn: #fbbf24; --warn-bg: #33270c; --crit: #f87171; --crit-bg: #3a1717; --info: #93b4ff; --info-bg: #17254a;
  color-scheme: dark;
}
:root[data-theme="sun"] {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f0f0f0; --ink: #000; --muted: #222; --line: #000;
  --nav-active: #000; --nav-active-ink: #fff; --ok: #006b2c; --warn: #8a4200; --crit: #a00000; --info: #0a2d9c; color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 19px; font-weight: 700; margin: 0; }
h3 { font-size: 16px; font-weight: 700; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.demo-band { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; text-align: center;
  padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top-inner { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 12px; letter-spacing: .02em; background: var(--accent-soft); flex: none; }
.logo b { display: block; font-size: 18px; line-height: 1.1; }
.logo span { display: block; font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
:root[data-theme="sun"] .logo span { color: var(--ink); }
.site-sel { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 600; max-width: 100%; }
.btn-ai { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 700; }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.when { font-size: 13px; color: var(--muted); line-height: 1.2; text-align: right; }
.icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid transparent; background: none; display: inline-grid; place-items: center; font-size: 17px; position: relative; }
.icon:hover { background: var(--surface-2); border-color: var(--line); }
.badge { position: absolute; top: 2px; right: 2px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; min-width: 18px; height: 18px; display: grid; place-items: center; padding-inline: 4px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; border: 2px solid var(--ink); }
.menu-btn { display: inline-grid; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 1fr; }
.side { position: fixed; inset: 0 auto 0 0; width: min(290px, 86vw); z-index: 40; background: var(--surface); border-right: 1px solid var(--line);
  overflow-y: auto; transform: translateX(-102%); transition: transform .2s;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 12px calc(14px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.side.open { transform: none; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgb(0 0 0 / .4); }
.proj-card { display: flex; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; }
.proj-card b { display: block; font-size: 14px; line-height: 1.2; }
.proj-card span { font-size: 12px; color: var(--muted); }
.nav-group { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
.nav { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 600; font-size: 15px; color: var(--ink); }
.nav .ic { width: 20px; text-align: center; opacity: .85; }
.nav:hover { background: var(--surface-2); }
.nav[aria-current="page"] { background: var(--nav-active); color: var(--nav-active-ink); }
.nav .new { margin-left: auto; font-size: 10px; font-weight: 800; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 1px 6px; }
.nav[aria-current="page"] .new { background: var(--surface); color: var(--ink); }

main { min-width: 0; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { display: grid; gap: 18px; max-width: 1240px; margin-inline: auto; }

@media (min-width: 1024px) {
  .layout { grid-template-columns: 270px minmax(0, 1fr); }
  .side { position: sticky; top: 66px; width: auto; height: calc(100vh - 66px); transform: none; z-index: 1; transition: none; padding-top: 14px; }
  .menu-btn { display: none; }
  .scrim { display: none; }
}

/* ---------- common blocks ---------- */
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--nav-active); border-color: var(--nav-active); color: var(--nav-active-ink); }
.btn.sm { padding: 5px 10px; font-size: 13px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card.pad { padding: 16px; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }

.datebar { display: grid; gap: 12px; padding: 14px 16px; }
.datebar .row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 7px 12px; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--nav-active); color: var(--nav-active-ink); }
.anchor { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.anchor .d { border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-weight: 700; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 760px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } .stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stat { padding: 14px 16px; display: grid; gap: 4px; align-content: start; text-align: left; }
.stat .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.stat .num { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
.stat .num small { font-size: 15px; font-weight: 700; color: var(--muted); margin-left: 3px; }
.stat .foot { font-size: 13px; color: var(--muted); }
.stat.hl { border-color: var(--ok); background: color-mix(in srgb, var(--ok-bg) 60%, var(--surface)); }
.stat.hl-crit { border-color: var(--crit); }
button.card { text-align: left; }
button.card:hover { border-color: var(--ink); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }

.two { display: grid; gap: 18px; }
@media (min-width: 1024px) { .two { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; } }

.mods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 760px) { .mods { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.mod { padding: 18px 12px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.mod .bubble { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: var(--surface-2); }
.mod b { font-size: 16px; }
.mod span { font-size: 13px; color: var(--muted); }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; }
.tab .dot { width: 9px; height: 9px; border-radius: 50%; }
.tab[aria-pressed="true"] { background: var(--nav-active); color: var(--nav-active-ink); border-color: var(--nav-active); }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); }
td.r, th.r { text-align: right; }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 800; background: var(--surface-2); border-bottom: 0; }
.sub-line { display: block; font-size: 12px; color: var(--muted); }

.list { display: grid; }
.li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .t { font-weight: 600; }
.li .s { font-size: 13px; color: var(--muted); }
.li .v { font-weight: 800; white-space: nowrap; }

.alert { display: grid; grid-template-columns: 4px 1fr; gap: 12px; padding: 12px 14px 12px 0; border-bottom: 1px solid var(--line); }
.alert:last-child { border-bottom: 0; }
.alert .bar { border-radius: 0 4px 4px 0; }
.alert.crit .bar { background: var(--crit); }
.alert.warn .bar { background: var(--warn); }
.alert b { display: block; }
.alert span { font-size: 13px; color: var(--muted); }

.calc { display: grid; gap: 8px; padding: 16px; }
.calc .ln { display: flex; justify-content: space-between; gap: 8px; }
.calc .tot { border-top: 2px solid var(--ink); padding-top: 10px; font-size: 20px; font-weight: 800; }

.cards-3 { display: grid; gap: 12px; }
@media (min-width: 760px) { .cards-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.party { padding: 16px; display: grid; gap: 10px; }
.party .ph { display: flex; gap: 10px; align-items: center; }
.ini { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; font-weight: 800; flex: none; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 600; overflow-wrap: anywhere; }
.money3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; text-align: center; background: var(--surface-2); border-radius: 10px; padding: 8px; }
.money3 b { display: block; font-size: 15px; }
.money3 span { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 700; }

.muster { display: grid; gap: 12px; }

.mkr { display: flex; justify-content: space-between; font-size: 14px; }

.dpr { padding: 20px; display: grid; gap: 16px; }
.dpr-head { text-align: center; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }

.sig { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; text-align: center; font-size: 13px; }
.sig div { border-top: 1px solid var(--ink); padding-top: 6px; }

.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); padding: 10px 16px; border-top: 1px dashed var(--line); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 700; max-width: calc(100% - 32px); }
</style>

  function show(k) {
    if (!V[k]) return;

  function openMenu() { $("side").classList.add("open"); $("scrim").hidden = false; }

  let toastT;

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-go],[data-mat],[data-store],[data-site],[data-seg]");

    if (el.dataset.go) show(el.dataset.go);
    else if (el.dataset.mat) { matKey = el.dataset.mat; show("inventory"); }
    else if (el.dataset.store) { storeTab = el.dataset.store; show("store"); }

      show("projects"); toast(s.name + " chuna");
    } else if ("seg" in el.dataset) {
      el.parentElement.querySelectorAll("[data-seg]").forEach((b) => b.setAttribute("aria-pressed", String(b === el)));
    }
  });

  const THEMES = [null, "dark", "light", "sun"]; let ti = 0;

    toast(th === "sun" ? "Dhoop mode" : th ? th + " mode" : "Phone jaisa rang");
  });
